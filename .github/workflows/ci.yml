name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claudius-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # `check` runs the tests and the JaCoCo 90% coverage verification.
      - run: ./gradlew check --console=plain

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claudius-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claudius-frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run coverage

  # One image (backend + built frontend). The bash sandbox (Landlock via landrun) is proven on
  # Linux inside the image build.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target landlock-test .
      - run: docker build -t claudius .
